  <style>
    /* Mesmas cores e fontes do site (igorbarber.pages.dev) */
    :root {
      --preto: #0e0e0e;
      --branco: #ffffff;
      --texto-suave: #5c5a56;
      --vermelho: #e4202a;
      --vermelho-escuro: #c2161f;
      --azul: #1f3fbf;
      --claro-85: rgba(255, 255, 255, 0.85);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "Archivo", system-ui, sans-serif;
      --suave: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--branco);
      color: var(--preto);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .listra {
      flex: none;
      height: 8px;
      background: repeating-linear-gradient(
        -45deg,
        var(--vermelho) 0 12px,
        var(--branco) 12px 24px,
        var(--azul) 24px 36px,
        var(--branco) 36px 48px
      );
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 3rem 16px calc(2.5rem + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo { display: block; width: min(64vw, 240px); height: auto; }

    .local {
      margin: 1.75rem 0 0.4rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .frase { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 1.5rem; }
    .provas { margin: 0.8rem 0 0; font-size: 0.875rem; color: var(--texto-suave); }
    .estrela { color: var(--vermelho); }

    .links { list-style: none; margin: 2.25rem 0 0; padding: 0; width: 100%; display: grid; gap: 12px; }

    .link {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 68px;
      padding: 0.85rem 1.15rem;
      border: 2px solid var(--preto);
      background: var(--branco);
      color: var(--preto);
      text-decoration: none;
      text-align: left;
      transition: transform .25s var(--suave), background-color .2s, border-color .2s;
    }
    .link:hover { transform: translateY(-2px); }
    .link:active { transform: scale(0.98); }
    .link svg { flex: none; width: 26px; height: 26px; }
    .link span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.1rem; }
    .link strong { font-size: 1.0625rem; font-weight: 600; }
    .link small { font-size: 0.8125rem; color: var(--texto-suave); }
    .link::after { content: "→"; font-weight: 600; transition: transform .25s var(--suave); }
    .link:hover::after { transform: translateX(4px); }

    .link--whats { background: var(--vermelho); border-color: var(--vermelho); color: var(--branco); }
    .link--whats:hover { background: var(--vermelho-escuro); border-color: var(--vermelho-escuro); }
    .link--site { background: var(--preto); color: var(--branco); }
    .link--whats small, .link--site small { color: var(--claro-85); }

    :focus-visible { outline: 2px solid var(--vermelho); outline-offset: 3px; }

    .anima { animation: sobe .7s var(--suave) both; animation-delay: calc(var(--i) * 90ms + 100ms); }
    @keyframes sobe { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .anima { animation: none; }
      .link, .link::after { transition: none; }
    }
  </style>
